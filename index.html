<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xhc861 's文件服务器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f7df4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z'/%3E%3C/svg%3E">
</head>
<body>
  <div class="header">
    <h1 data-i18n="title">File Server</h1>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn active" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="ja">日本語</button>
      </div>
    </div>
  </div>

  <div class="warning">
    <strong data-i18n="warning-title">Notice:</strong>
    <span data-i18n="warning-text">This system is designed for small files only (JS, CSS, JSON, etc.). Large files may experience slow download speeds.</span>
  </div>

  <div class="container">
    <div class="toolbar">
      <nav class="breadcrumb" id="breadcrumb" aria-label="breadcrumb"></nav>
      <div class="search" id="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="search" id="searchInput" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="searchPlaceholder" placeholder="搜索所有文件…"
               aria-label="搜索所有文件">
        <button class="search-clear" id="searchClear" aria-label="清除搜索">&times;</button>
      </div>
    </div>

    <div class="file-list" id="filesList"></div>
  </div>

  <div class="modal" id="fileModal" role="dialog" aria-modal="true" aria-labelledby="modalFileName">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalFileName"></h2>
        <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div class="file-info" id="fileInfo"></div>
      <div class="modal-actions">
        <button class="btn-block btn-secondary" id="modalCopyBtn">
          <span data-i18n="copyLink">复制链接</span>
        </button>
        <button class="btn-block btn-primary" id="modalDownloadBtn">
          <span data-i18n="download">下载</span>
        </button>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>&copy; 2026 xhc861. All rights reserved.</p>
    <p><span data-i18n="footer">欢迎访问个人网站</span> <a href="https://xhc861.top" target="_blank" rel="noopener">(xhc861.top)</a></p>
    <button class="toggle-effects-btn" id="toggleEffects">关闭所有网页特效</button>
  </div>

  <canvas id="petalCanvas"></canvas>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
